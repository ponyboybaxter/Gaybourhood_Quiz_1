<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>The Gaybourhood Quiz</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background-color:#121212;color:#ffffff;margin:0;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh}
.logo-container{margin-bottom:20px;text-align:center}.logo-container img{max-width:180px;height:auto;border-radius:8px}
.card{background:#1e1e1e;padding:30px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.4);width:100%;max-width:450px;box-sizing:border-box;text-align:center;position:relative;overflow:hidden;border:1px solid #2d2d2d}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#ff007f,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#7f00ff)}
.hidden{display:none !important}
input{width:100%;padding:14px;margin:12px 0;border:1px solid #333;border-radius:8px;box-sizing:border-box;font-size:16px;background:#2a2a2a;color:white}
.action-btn{display:block;background:linear-gradient(135deg,#ff007f,#7f00ff);color:white;text-decoration:none;padding:14px 20px;font-size:16px;font-weight:bold;border-radius:8px;cursor:pointer;margin-top:12px;text-align:center;border:none;width:100%;box-sizing:border-box}
.option-btn{background:#2a2a2a;color:#fff;text-align:left;margin:10px 0;border:1px solid #3c3c3c;width:100%;padding:14px;font-size:16px;border-radius:8px;cursor:pointer;display:block;box-sizing:border-box}
.option-btn:hover {background:#3a3a3a;border-color:#ff007f}
.timer-container{width:100%;background-color:#333;height:6px;border-radius:3px;margin:15px 0;overflow:hidden}
.timer-bar{height:100%;background:#ff007f;width:100%;transition:width 1s linear}
ol{padding-left:0;list-style:none;text-align:left}
li{padding:12px;border-bottom:1px solid #2d2d2d;display:flex;justify-content:space-between;align-items:center}
.rank{font-weight:bold;color:#ff007f;margin-right:8px}
</style></head><body>
<div class="logo-container"><img src="3A1E49B9-38B7-4887-AF88-45CC49875B8D.png" id="logo" alt="The Gaybourhood Logo"></div>
<div id="setup-screen" class="card">
<h2 style="margin-top:10px">The Gaybourhood Quiz 🏆</h2>
<input type="text" id="username" placeholder="Enter Your Name">
<input type="text" id="userphone" placeholder="Last 3 Digits of Phone">
<button class="action-btn" id="start-btn">Start Quiz</button>
</div>
<div id="quiz-screen" class="card hidden">
<div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>
<h3 id="question-text" style="margin-bottom:20px">Loading...</h3>
<div id="options-container"></div>
</div>
<div id="leaderboard-screen" class="card hidden">
<h2>Leaderboard 🏆</h2><ol id="leaderboard-list">Loading standings...</ol>
<button class="action-btn" id="reload-btn">Play Again</button>
</div>
<script src="quiz-script.js"></script>
</body></html>
